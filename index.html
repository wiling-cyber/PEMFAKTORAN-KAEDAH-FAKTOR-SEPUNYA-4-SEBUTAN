    // Web Audio API Synthesizer
    let audioEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        const icon = document.getElementById('audioIcon');
        if (audioEnabled) {
            icon.setAttribute('data-lucide', 'volume-2');
            playSound('click');
        } else {
            icon.setAttribute('data-lucide', 'volume-x');
        }
        lucide.createIcons();
    }

    function playSound(type) {
        if (!audioEnabled) return;
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            if (type === 'click') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'select') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'wrong') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'victory') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.1);
                    gain.gain.setValueAtTime(0.25, now + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + index * 0.1);
                    osc.stop(now + index * 0.1 + 0.3);
                });
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

            explanation: `
                <p class="font-bold text-purple-700 mb-1">Langkah Pengiraan (Pengumpulan Semula):</p>
                <ol class="list-decimal list-inside text-sm text-slate-700 space-y-1">
                    <li>Kumpulkan sebutan: \\((4ap - 4aq) + (bp - bq)\\)</li>
                    <li>Faktorkan faktor sepunya: \\(4a(p - q) + b(p - q)\\)</li>
                    <li>Faktorkan ungkapan sepunya \\((p - q)\\): \\((4a + b)(p - q)\\)</li>
                </ol>
            `
        },
        {
            id: 13,
            question: "Faktorkan ungkapan algebra \\(km + kn - m - n\\).",
            options: ["(k - 1)(m + n)", "(k + 1)(m - n)", "(k - m)(n - 1)", "(km - 1)(n + 1)"],
            correctAnswerText: "(k - 1)(m + n)",
            explanation: `
                <p class="font-bold text-purple-700 mb-1">Langkah Pengiraan (Pengumpulan Semula):</p>
                <ol class="list-decimal list-inside text-sm text-slate-700 space-y-1">
                    <li>Kumpulkan sebutan: \\((km + kn) - (m + n)\\)</li>
                    <li>Faktorkan faktor sepunya: \\(k(m + n) - 1(m + n)\\)</li>
                    <li>Faktorkan ungkapan sepunya \\((m + n)\\): \\((k - 1)(m + n)\\)</li>
                </ol>
            `
        },
        {
            id: 14,
            question: "Faktorkan ungkapan algebra \\(6xy - 4x + 9y - 6\\).",
            options: ["(2x + 3)(3y - 2)", "(2x - 3)(3y + 2)", "(3x + 2)(2y - 3)", "(6x + 3)(y - 2)"],
            correctAnswerText: "(2x + 3)(3y - 2)",
            explanation: `
                <p class="font-bold text-purple-700 mb-1">Langkah Pengiraan (Pengumpulan Semula):</p>
                <ol class="list-decimal list-inside text-sm text-slate-700 space-y-1">
                    <li>Kumpulkan sebutan: \\((6xy - 4x) + (9y - 6)\\)</li>
                    <li>Faktorkan faktor sepunya: \\(2x(3y - 2) + 3(3y - 2)\\)</li>
                    <li>Faktorkan ungkapan sepunya \\((3y - 2)\\): \\((2x + 3)(3y - 2)\\)</li>
                </ol>
            `
        },
        {
            id: 15,
            question: "Faktorkan ungkapan algebra \\(2x^2 + 6x + xy + 3y\\).",
            options: ["(2x + y)(x + 3)", "(2x - y)(x - 3)", "(x + y)(2x + 3)", "(2x + 3)(x + y)"],
            correctAnswerText: "(2x + y)(x + 3)",
            explanation: `
                <p class="font-bold text-purple-700 mb-1">Langkah Pengiraan (Pengumpulan Semula):</p>
                <ol class="list-decimal list-inside text-sm text-slate-700 space-y-1">
                    <li>Kumpulkan sebutan: \\((2x^2 + 6x) + (xy + 3y)\\)</li>
                    <li>Faktorkan faktor sepunya: \\(2x(x + 3) + y(x + 3)\\)</li>
                    <li>Faktorkan ungkapan sepunya \\((x + 3)\\): \\((2x + y)(x + 3)\\)</li>
                </ol>
            `
        }
    ];

    let userAnswers = {};

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    const optionColorClasses = [
        "bg-blue-50/80 border-blue-200 hover:border-blue-400 hover:bg-blue-100/80 text-blue-900",
        "bg-pink-50/80 border-pink-200 hover:border-pink-400 hover:bg-pink-100/80 text-pink-900",
        "bg-amber-50/80 border-amber-200 hover:border-amber-400 hover:bg-amber-100/80 text-amber-900",
        "bg-emerald-50/80 border-emerald-200 hover:border-emerald-400 hover:bg-emerald-100/80 text-emerald-900"
    ];

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = rawQuizData.map((q, idx) => {
            const shuffledOptions = shuffleArray(q.options);

            return `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl p-6 shadow-md border-2 border-purple-100 animate-card" id="q_card_${q.id}">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div class="flex items-start gap-3">
                            <span class="bg-purple-100 text-purple-800 text-sm font-black px-3 py-1 rounded-xl font-display">
                                Soalan ${idx + 1}
                            </span>
                            <p class="text-lg font-bold text-slate-800 leading-relaxed pt-0.5">
                                ${q.question}
                            </p>
                        </div>
                        <span id="badge_q_${q.id}" class="hidden px-3 py-1 rounded-full text-xs font-black shrink-0"></span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-2 sm:pl-4" id="options_q_${q.id}">
                        ${shuffledOptions.map((opt, oIdx) => {
                            const colorClass = optionColorClasses[oIdx % optionColorClasses.length];
                            return `
                                <label id="label_q_${q.id}_${oIdx}" class="opt-label flex items-center justify-between p-3.5 rounded-2xl border-2 ${colorClass} cursor-pointer transition-all font-semibold shadow-sm hover:shadow-md group">
                                    <div class="flex items-center">
                                        <input type="radio" name="q_${q.id}" value="${opt}" onchange="selectAndCheckAnswer(${q.id}, '${opt}', '${q.correctAnswerText}')"
                                            class="w-5 h-5 text-purple-600 focus:ring-purple-400 border-slate-300 rounded-full">
                                        <span class="ml-3 font-bold">\\(${opt}\\)</span>
                                    </div>
                                    <span class="status-icon font-extrabold text-sm hidden"></span>
                                </label>
                            `;
                        }).join('')}
                    </div>

                    <!-- Kotak Langkah Pengiraan Terus Dipaparkan Jika Salah -->
                    <div id="explanation_q_${q.id}" class="hidden mt-4 pt-4 border-t-2 border-rose-100 bg-rose-50/50 p-4 rounded-2xl animate-card">
                        <p class="text-sm font-bold text-rose-700 mb-2 flex items-center gap-1">
                            <span>❌</span> Jawapan anda tidak tepat! Jawapan betul: <span class="text-emerald-700 ml-1 font-extrabold">\\(${q.correctAnswerText}\\)</span>
                        </p>
                        <div class="bg-white p-4 rounded-xl border border-slate-200">
                            ${q.explanation}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function selectAndCheckAnswer(questionId, selectedVal, correctVal) {
        userAnswers[questionId] = selectedVal;
        updateProgress();

        const optionsContainer = document.getElementById(`options_q_${questionId}`);
        const labels = optionsContainer.querySelectorAll('.opt-label');
        const inputs = optionsContainer.querySelectorAll('input[type="radio"]');
        const badge = document.getElementById(`badge_q_${questionId}`);
        const expBox = document.getElementById(`explanation_q_${questionId}`);

        inputs.forEach(input => input.disabled = true);

        const isCorrect = selectedVal === correctVal;

        if (isCorrect) {
            playSound('select');
            badge.innerText = '✓ BETUL';
            badge.className = 'px-3 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-800 border border-emerald-300';
            badge.classList.remove('hidden');
        } else {
            playSound('wrong');
            badge.innerText = '✗ SALAH';
            badge.className = 'px-3 py-1 rounded-full text-xs font-black bg-rose-100 text-rose-800 border border-rose-300';
            badge.classList.remove('hidden');
            expBox.classList.remove('hidden');
        }

        labels.forEach(label => {
            const input = label.querySelector('input');
            const icon = label.querySelector('.status-icon');
            label.classList.remove('hover:shadow-md', 'cursor-pointer');
            label.classList.add('cursor-not-allowed', 'opacity-90');

            if (input.value === correctVal) {
                label.className = 'flex items-center justify-between p-3.5 rounded-2xl border-2 bg-emerald-100 border-emerald-500 text-emerald-950 font-bold shadow-md';
                icon.innerText = '✓ Betul';
                icon.className = 'status-icon font-extrabold text-sm text-emerald-700 ml-2';
                icon.classList.remove('hidden');
            } else if (input.value === selectedVal && !isCorrect) {
                label.className = 'flex items-center justify-between p-3.5 rounded-2xl border-2 bg-rose-100 border-rose-500 text-rose-950 font-bold shadow-md';
                icon.innerText = '✗ Salah';
                icon.className = 'status-icon font-extrabold text-sm text-rose-700 ml-2';
                icon.classList.remove('hidden');
            } else {
                label.classList.add('opacity-40');
            }
        });

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function updateProgress() {
        const count = Object.keys(userAnswers).length;
        document.getElementById('progressText').innerText = `${count}/15 Dijawab`;
        const percentage = (count / 15) * 100;
        document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function submitQuiz() {
        const name = document.getElementById('studentName').value.trim();
        const studentClass = document.getElementById('studentClass').value.trim();

        if (!name || !studentClass) {
            alert('Sila lengkapkan Nama dan Kelas anda terlebih dahulu.');
            return;
        }

        const answeredCount = Object.keys(userAnswers).length;
        if (answeredCount < 15) {
            if (!confirm(`Anda baru menjawab ${answeredCount} daripada 15 soalan. Adakah anda pasti mahu menghantar jawapan?`)) {
                return;
            }
        }

        let correctCount = 0;
        rawQuizData.forEach(q => {
            if (userAnswers[q.id] === q.correctAnswerText) {
                correctCount++;
            }
        });

        const score = Math.round((correctCount / 15) * 100);

        document.getElementById('scorePercent').innerText = `${score}%`;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('studentGreeting').innerText = `Tahniah ${name} (${studentClass})! Anda telah menyelesaikan kuiz ini.`;

        const badgeEmoji = document.getElementById('badgeEmoji');
        const scoreBadge = document.getElementById('scoreBadge');
        const resultTitle = document.getElementById('resultTitle');

        if (score >= 80) {
            badgeEmoji.innerText = '🏆';
            scoreBadge.className = 'w-32 h-32 rounded-full flex flex-col items-center justify-center mx-auto mb-4 border-4 text-4xl font-black shadow-inner font-display bg-emerald-100 border-emerald-400 text-emerald-700';
            resultTitle.innerText = 'Cemerlang!';
            playSound('victory');
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        } else if (score >= 50) {
            badgeEmoji.innerText = '🌟';
            scoreBadge.className = 'w-32 h-32 rounded-full flex flex-col items-center justify-center mx-auto mb-4 border-4 text-4xl font-black shadow-inner font-display bg-amber-100 border-amber-400 text-amber-700';
            resultTitle.innerText = 'Syabas!';
            playSound('victory');
        } else {
            badgeEmoji.innerText = '💪';
            scoreBadge.className = 'w-32 h-32 rounded-full flex flex-col items-center justify-center mx-auto mb-4 border-4 text-4xl font-black shadow-inner font-display bg-rose-100 border-rose-400 text-rose-700';
            resultTitle.innerText = 'Teruskan Usaha!';
            playSound('click');
        }

        const solutionsContainer = document.getElementById('solutionsContainer');
        solutionsContainer.innerHTML = rawQuizData.map((q, idx) => {
            const userChoice = userAnswers[q.id];
            const isCorrect = userChoice === q.correctAnswerText;

            return `
                <div class="p-5 rounded-2xl border-2 ${isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'}">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-slate-700">Soalan ${idx + 1}: ${q.question}</span>
                        <span class="px-3 py-1 rounded-full text-xs font-black ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                            ${isCorrect ? '✓ Betul' : '✗ Salah'}
                        </span>
                    </div>
                    <div class="text-sm font-semibold space-y-1 mb-3">
                        <p class="${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                            Jawapan Anda: \\(${userChoice || 'Tiada Jawapan'}\\)
                        </p>
                        ${!isCorrect ? `<p class="text-emerald-700">Jawapan Tepat: \\(${q.correctAnswerText}\\)</p>` : ''}
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200">
                        ${q.explanation}
                    </div>
                </div>
            `;
        }).join('');

        const formData = new FormData();
        formData.append('Nama', name);
        formData.append('Kelas', studentClass);
        formData.append('Markah', score);
        formData.append('Betul', `${correctCount}/15`);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => console.log('Successfully saved to spreadsheet'))
            .catch(err => console.log('Submission error:', err));

        document.getElementById('quizForm').classList.add('hidden');
        document.getElementById('resultsSection').classList.remove('hidden');

        if (window.MathJax) {
            MathJax.typesetPromise();
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
        userAnswers = {};
        document.getElementById('quizForm').reset();
        document.getElementById('quizForm').classList.remove('hidden');
        document.getElementById('resultsSection').classList.add('hidden');
        updateProgress();
        renderQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        renderQuestions();
    });
</script>
</body>
</html>
